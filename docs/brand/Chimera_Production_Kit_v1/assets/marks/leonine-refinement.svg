<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305 206">
  <title>Chimera metallic lion refinement</title>
  <desc>Large swept metallic wings rise from behind the shoulders and all three heads. The dragon's ear, eagle, crown and eyes remain in the foreground, with a fuller copper and silver lion mane and broad feline jaw.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4F5F3"/>
      <stop offset=".45" stop-color="#B1B7BE"/>
      <stop offset="1" stop-color="#505A68"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE0A1"/>
      <stop offset=".35" stop-color="#FF9A24"/>
      <stop offset="1" stop-color="#CC3505"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A6ADB5"/>
      <stop offset="1" stop-color="#303943"/>
    </linearGradient>
  </defs>
  <g id="wings" stroke="#161B20" stroke-width="1.1" stroke-linejoin="round">
