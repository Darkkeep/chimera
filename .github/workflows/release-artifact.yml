name: Build Chimera release artifact
on:
  pull_request:
    paths:
      - '.github/workflows/release-artifact.yml'
      - 'scripts/build-release.sh'
      - 'frontend/src/App.tsx'
      - 'scripts/chimera-ssh-preflight.py'
      - 'scripts/test_chimera_ssh_preflight.py'
      - 'docs/chimera2-production-promotion-runbook.md'
  workflow_dispatch:
    inputs:
      studio_enabled:
        description: Include Studio in the release candidate
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate noninteractive SSH preflight contract
        run: python scripts/test_chimera_ssh_preflight.py
      - name: Package exact checkout
        env:
          STUDIO_ENABLED: ${{ github.event_name == 'pull_request' && 'true' || inputs.studio_enabled }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/build-release.sh "$SOURCE_SHA" "$STUDIO_ENABLED"
      - name: Verify SHA manifest, Studio default, and archive integrity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STUDIO_ENABLED: ${{ github.event_name == 'pull_request' && 'true' || inputs.studio_enabled }}
        run: |
          python - <<'PY'
          import io, json, os, subprocess, tarfile
          from pathlib import Path

          sha, studio = os.environ["SOURCE_SHA"], os.environ["STUDIO_ENABLED"] == "true"
          directory = Path("release-artifacts") / f"chimera-{sha}-studio-{str(studio).lower()}"
          archive = directory / f"chimera-{sha}-studio-{str(studio).lower()}.tar.gz"
          subprocess.run(["sha256sum", "--check", "SHA256SUMS"], cwd=directory, check=True)
          with tarfile.open(archive, "r:gz") as tar:
              def read_json(name):
                  stream = tar.extractfile(name)
                  if stream is None:
                      raise ValueError(f"Missing artifact member: {name}")
                  return json.load(stream)
              manifest = read_json("release-manifest.json")
              identity = read_json("frontend/dist/release-version.json")
          for document in (manifest, identity):
              assert document["sourceSha"] == sha, "Artifact SHA mismatch"
              assert document["studioEnabled"] == studio, "Studio enabled mismatch"
              assert document["studioDefault"] == studio, "Studio default mismatch"
          print("Artifact checksum, exact SHA and Studio startup mode verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chimera-${{ github.event.pull_request.head.sha || github.sha }}-studio-${{ github.event_name == 'pull_request' && 'true' || inputs.studio_enabled }}
          path: release-artifacts/*/*
          if-no-files-found: error
          retention-days: 30
