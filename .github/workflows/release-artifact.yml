name: Build Chimera release artifact
on:
  workflow_dispatch:
    inputs:
      studio_enabled:
        description: Include Studio in the release candidate
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package exact checkout
        env:
          STUDIO_ENABLED: ${{ inputs.studio_enabled }}
        run: bash scripts/build-release.sh "$GITHUB_SHA" "$STUDIO_ENABLED"
      - uses: actions/upload-artifact@v4
        with:
          name: chimera-${{ github.sha }}-studio-${{ inputs.studio_enabled }}
          path: release-artifacts/*/*
          if-no-files-found: error
          retention-days: 30
