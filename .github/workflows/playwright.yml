name: Chimera checks
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    name: Backend, build, visual exports, and HTTPS auth
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PYTHIA_CONTRACTS_READ_TOKEN || github.token }}
        submodules: recursive
    - uses: actions/setup-node@v4
      with:
        node-version: '24.19.0'
    - name: Install dependencies
      run: npm ci
    - name: Install frontend dependencies
      run: npm ci --prefix frontend
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install backend dependencies
      run: pip install -r backend/requirements-dev.txt
    - name: Verify retained qualification evidence
      run: python docs/qualification/support/verify.py
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run backend checks
      run: python -m unittest discover -s backend/tests
    - name: Verify pinned onboarding artifact
      run: npm run verify:onboarding:artifact
    - name: Build frontend
      run: npm run build --prefix frontend
    - name: Qualify visual editing and exported rendering
      if: ${{ success() || failure() }}
      run: npm run test:visual
      env:
        CHIMERA_TEST_PYTHON: python
    - name: Qualify hosted authentication over HTTPS
      if: ${{ success() || failure() }}
      run: npm run test:auth
      env:
        CHIMERA_TEST_PYTHON: python
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: authentication-qualification
        path: workspace/auth-qualification/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: visual-qualification
        path: workspace/visual-qualification/
        retention-days: 30

  browser:
    name: Browser (${{ matrix.browser }}, shard ${{ matrix.shard }}/3)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    env:
      CHIMERA_TEST_PYTHON: python
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PYTHIA_CONTRACTS_READ_TOKEN || github.token }}
        submodules: recursive
    - uses: actions/setup-node@v4
      with:
        node-version: '24.19.0'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        npm ci
        npm ci --prefix frontend
        pip install -r backend/requirements-dev.txt
    - name: Install selected browser
      run: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Run browser integration tests
      run: npm run test:onboarding -- --project ${{ matrix.browser }} --shard ${{ matrix.shard }}/3 --workers 1
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: browser-${{ matrix.browser }}-shard-${{ matrix.shard }}
        path: |
          playwright-report/
          test-results/
        retention-days: 30
