name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PYTHIA_CONTRACTS_READ_TOKEN || github.token }}
        submodules: recursive
    - uses: actions/setup-node@v4
      with:
        node-version: '24.19.0'
    - name: Install dependencies
      run: npm ci
    - name: Install frontend dependencies
      run: npm ci --prefix frontend
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install backend dependencies
      run: pip install -r backend/requirements-dev.txt
    - name: Verify retained qualification evidence
      run: python docs/qualification/support/verify.py
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run backend checks
      run: python -m unittest discover -s backend/tests
    - name: Verify pinned onboarding artifact
      run: npm run verify:onboarding:artifact
    - name: Build frontend
      run: npm run build --prefix frontend
    - name: Run onboarding browser tests
      run: npm run test:onboarding
    - name: Qualify visual editing and exported rendering
      if: ${{ success() || failure() }}
      run: npm run test:visual
      env:
        CHIMERA_TEST_PYTHON: python
    - name: Qualify hosted authentication over HTTPS
      if: ${{ success() || failure() }}
      run: npm run test:auth
      env:
        CHIMERA_TEST_PYTHON: python
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: authentication-qualification
        path: workspace/auth-qualification/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: visual-qualification
        path: workspace/visual-qualification/
        retention-days: 30
