<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task practice · Guided workflows</title></head>
<body>
  <main class="demo-layout">
    <aside id="guide-rail" aria-label="Task help"><p class="rail-label">QUICK START</p><h2>Make a little progress.</h2><p>Create a task, refine its title, and mark it complete. Your work stays in this browser.</p><button id="start-guide">Start / resume walkthrough</button></aside>
    <section class="task-workspace" aria-labelledby="workspace-title">
      <header><p class="eyebrow">TASK CREATOR</p><h1 id="workspace-title">Create a new task</h1><p>Use the form below to add a task. You can always edit the details later.</p></header>
      <form id="task-form" data-onboarding="task.create"><label for="task-title">TITLE</label><input id="task-title" required maxlength="120" placeholder="e.g. Write the introduction"><label for="description">DESCRIPTION (OPTIONAL)</label><textarea id="description" rows="4" placeholder="Add some context or helpful notes…"></textarea><div class="form-actions"><button type="submit">Create task →</button></div></form>
      <p id="notice" role="status"></p><section aria-labelledby="tasks-title"><h2 id="tasks-title">Your tasks</h2><div id="task-list"></div></section>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
