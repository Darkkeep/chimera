# Install as a site configuration after provisioning TLS certificates and accounts.
# The application is served from frontend/dist; the API listens on loopback only.
limit_req_zone $binary_remote_addr zone=chimera_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=chimera_api:10m rate=30r/s;

server {
    listen 80;
    server_name darkrogue.io;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name darkrogue.io;
    ssl_certificate /etc/letsencrypt/live/darkrogue.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkrogue.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/chimera/frontend/dist;
    index index.html;
    client_max_body_size 500m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/auth/login {
        limit_req zone=chimera_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        limit_req zone=chimera_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 240s;
    }
    location / {
        try_files $uri /index.html;
    }
    location ~ /\. {
        deny all;
    }
}
